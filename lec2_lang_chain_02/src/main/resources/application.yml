spring:
  application:
    name: stock-chat
  datasource:
    url: jdbc:h2:file:./data/stockdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Ollama 설정
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: gpt-oss:20b
      temperature: 0.7

# KIS API 설정 (환경변수로 주입)
kis:
  api:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    base-url: https://openapi.koreainvestment.com:9443

logging:
  level:
    com.stock.chat: DEBUG