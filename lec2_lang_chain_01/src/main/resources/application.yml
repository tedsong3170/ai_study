spring:
  application:
    name: langchain-error-code-api
  
  datasource:
    url: jdbc:h2:mem:errorcode
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

langchain:
  ollama:
    base-url: http://localhost:11434
    model-name: gpt-oss:20b
    timeout: 60s

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.langchain: DEBUG
